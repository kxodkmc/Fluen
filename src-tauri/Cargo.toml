[package]
name = "fluen"
version = "0.0.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fluen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
chrono = "0.4.45"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
# NOTE: confluent → referee 迁移完成，confluent 依赖已移除
referee-core  = { path = "../crates/referee/referee-core" }
referee-ai    = { path = "../crates/referee/referee-ai", features = ["openai"] }
referee-agent = { path = "../crates/referee/referee-agent", features = ["openai", "mcp-stdio"] }
fluen-markup = { path = "../crates/fluen-markup", features = ["serde"] }
fluen-kb = { path = "../crates/fluen-kb", features = ["async", "mcp-server"] }
# MCP 客户端（与 fluen-kb 的 rmcp 同版本，共享类型）
rmcp = { version = "3", default-features = false, features = ["client", "transport-async-rw"] }
rusqlite = { version = "0.37", features = ["bundled"] }
socstat = { path = "../crates/socstat", features = ["csv", "sav"] }
parking_lot = "0.12"
async-trait = "0.1"
anyhow = "1"
tokio-util = { version = "0.7", features = ["rt"] }
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "http2", "multipart"] }
base64 = "0.22"
sha2 = "0.10"
# 审批弹窗的行级 diff 预演算（motis_chat::approval_diff）
similar = "2"
pdf_oxide = "0.3"
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"
