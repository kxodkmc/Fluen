[workspace]
members = [
    "crates/boardgame",
    "crates/fluen-markup",
    "crates/fluen-kb",
    "crates/socstat",
    "crates/socstat/crates/socstat-mcp",
    "crates/referee/referee-core",
    "crates/referee/referee-ai",
    "crates/referee/referee-agent",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true